name: iOS build

# Builds an unsigned Vault.ipa for sideloading with AltStore / Sideloadly,
# which re-sign it with the user's own Apple ID on install. Manual trigger
# only: macOS runner minutes are expensive, and a weekly AltStore refresh
# re-signs the installed app without needing a new build. The push trigger
# lets the workflow be exercised from ios-dev before it reaches main (the
# manual button only appears for workflows on the default branch).

on:
  workflow_dispatch:
  push:
    branches: [ios-dev]
    paths: [.github/workflows/ios.yml]

jobs:
  build-ios:
    name: Unsigned .ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ios-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ios-cargo-

      - name: Install dependencies
        run: |
          npm ci
          brew install xcodegen

      # src-tauri/gen/apple can only be generated on macOS, so it is created
      # here when the repo doesn't carry it. Info.ios.plist is merged in.
      - name: Generate Xcode project
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npm run tauri ios init -- --ci
          fi

      # Switch signing off in the generated project itself: drop any existing
      # signing keys from every buildSettings block and add NO overrides.
      # (XCODE_XCCONFIG_FILE doesn't reach the xcodebuild tauri spawns.)
      - name: Disable code signing
        run: |
          PBXPROJ=$(ls src-tauri/gen/apple/*.xcodeproj/project.pbxproj | head -n 1)
          perl -0pi -e '
            s/^\s*"?CODE_SIGN(?:ING_ALLOWED|ING_REQUIRED|_IDENTITY)[^;]*;\n//mg;
            s/(buildSettings = \{\n)/$1\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";\n/g;
          ' "$PBXPROJ"
          grep -c 'CODE_SIGNING_ALLOWED = NO' "$PBXPROJ"

      # The project's "Build Rust Code" phase only works while `tauri ios
      # build` is running (it fetches the CLI options from it), so xcodebuild
      # can't be called directly. The archive succeeds unsigned; the export
      # step after it needs signing and fails, which is expected -- the .app
      # is taken from the archive instead.
      - name: Build app
        run: |
          npm run tauri ios build -- --ci || echo "::warning::tauri ios build exited non-zero (expected: unsigned export)"

      - name: Package .ipa
        run: |
          ARCHIVE=$(find src-tauri/gen/apple ~/Library/Developer/Xcode/Archives -name '*.xcarchive' -type d 2>/dev/null | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No .xcarchive produced -- the archive step itself failed, see the build log"
            exit 1
          fi
          APP=$(ls -d "$ARCHIVE"/Products/Applications/*.app | head -n 1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Vault.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Vault-ipa
          path: Vault.ipa
          retention-days: 30
