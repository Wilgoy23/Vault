[package]
name = "vault"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Utilities
base64 = "0.22"
csv = "1"
uuid = { version = "1", features = ["v4"] }

# Desktop-only
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
dirs = "5"
arboard = "3"

# Windows-only: detecting the secure desktop, so the vault can lock when the
# screen does. Pinned to the version Tauri already pulls in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_System_StationsAndDesktops",
  # Windows Hello quick unlock
  "Security_Credentials",
  "Storage_Streams",
] }
sha2 = "0.10"

# Mobile-only
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-clipboard-manager = "2"

# Argon2id at 64 MiB is unusably slow when compiled without optimisation, and
# the vault tests exercise the real key derivation. Optimising just these
# crates keeps `cargo test` quick while the code under test stays a debug build.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
