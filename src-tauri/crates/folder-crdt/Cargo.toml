[package]
name = "folder-crdt"
version = "0.0.0"
description = "Merge records edited offline on several devices, synced through a shared folder"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
